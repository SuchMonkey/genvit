; Per-model configuration for the llama-server router (conffile).
; Written for llama-cpp b9888. See:
;   llama-server --help
;   https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md
;
; HOW TO TUNE A MODEL
;   1. Install it:  llama-server-model install <org>/<model>:<quant>
;   2. Copy the name from `llama-server-model list` (e.g. "ggml-org/gemma-3-4b-it-GGUF:Q4_K_M").
;   3. Add a section below with that exact name and uncomment the keys you want.
;   4. Restart to pick up preset changes:  systemctl restart llama-server
;
; Keys map to llama-server arguments (without the leading dashes).
; Booleans use true/false. Flag negation uses the "no-" prefix, e.g. no-mmproj.
; Values containing ';' are comments in INI, so prefer the short sampling
; sequence:  sampling-seq = pmt   (p=top_p, m=min_p, t=temp).

version = 1

; Global defaults shared by every model registered in this file.
; Model-specific sections override these.
[*]
; sampling-seq = pmt

; --------------------------------------------------------------------------
; Example 1: a plain text chat model with a big context window.
; The section key MUST equal the model name from `llama-server-model list`.
; --------------------------------------------------------------------------
; [ggml-org/gemma-3-4b-it-GGUF:Q4_K_M]
; ctx-size = 65536
; no-mmproj = true

; --------------------------------------------------------------------------
; Example 2: a reasoning/MTP-capable model (speculative decoding via MTP,
; thinking preserved in the content field).
; --------------------------------------------------------------------------
; [someorg/mtp-model-GGUF:Q4_K_M]
; ctx-size = 65536
; no-mmproj = true
; spec-type = draft-mtp
; spec-draft-n-max = 2
; chat-template-kwargs = {"preserve_thinking": true}
; sampling-seq = pmt
